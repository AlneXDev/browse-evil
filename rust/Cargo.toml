[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
browsevil-core = { path = "crates/browsevil-core" }
browsevil-relay = { path = "crates/browsevil-relay" }
browsevil-page = { path = "crates/browsevil-page" }
browsevil-capture = { path = "crates/browsevil-capture" }
browsevil-script = { path = "crates/browsevil-script" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
